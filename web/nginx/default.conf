# nginx site config for the web container: /api/ reverse proxy + SPA fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. With set $upstream below, nginx re-resolves the
    # backend service per request (cached 5s), so a backend container restart
    # with a new IP doesn't need an nginx reload; a static proxy_pass would be
    # resolved once at startup and break after a restart.
    resolver 127.0.0.11 valid=5s;

    location /api/ {
        set $upstream http://backend:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE (AI 助手流式回答) 需要关闭响应缓冲并保持长连接。
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
