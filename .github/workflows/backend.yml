name: Backend

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - '.gitignore'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify modules tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::Files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -v ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          version: latest

  docker:
    name: Prod image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f backend/Dockerfile.prod -t ocm-backend:ci backend/

      - name: Run & health check
        run: |
          docker run -d --name ocm-backend-ci -p 8080:8080 ocm-backend:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/healthz; then echo; break; fi
            sleep 0.5
          done
          curl -sf http://localhost:8080/healthz | grep -q ok
          docker stop ocm-backend-ci

      - name: Verify non-root runtime
        run: |
          docker run --rm --entrypoint /bin/sh ocm-backend:ci -c 'id -u' | grep -q 10001
          echo "runs as non-root uid 10001"
