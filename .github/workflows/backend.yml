name: Backend

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - '.gitignore'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - '.gitignore'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Verify modules tidy
        run: |
          go mod tidy
          # Only diff files that exist (go.sum is absent while there are no deps).
          files="go.mod"
          [ -f go.sum ] && files="$files go.sum"
          git diff --exit-code -- $files

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::Files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -v ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: v2.12.2

  docker:
    name: Prod image
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: ocm
          MYSQL_USER: ocm
          MYSQL_PASSWORD: ocm
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pci-root-password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f backend/Dockerfile -t ocm-backend:ci backend/

      - name: Run & readiness check
        run: |
          docker run -d --name ocm-backend-ci --network host \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_USER=ocm \
            -e DB_PASSWORD=ocm \
            -e DB_NAME=ocm \
            ocm-backend:ci
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/readyz; then echo; break; fi
            sleep 0.5
          done
          curl -sf http://localhost:8080/readyz | grep -q ok || { docker logs ocm-backend-ci; exit 1; }
          docker stop ocm-backend-ci

      - name: Verify non-root runtime
        run: |
          docker run --rm --entrypoint /bin/sh ocm-backend:ci -c 'id -u' | grep -q 10001
          echo "runs as non-root uid 10001"
