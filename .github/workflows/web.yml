name: Web

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      - '.gitignore'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -n "$(find dist/assets -name '*.js' -print -quit)"
          echo "dist artifacts present"

      - name: Test
        run: npm test --if-present

  docker:
    name: Prod image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f web/Dockerfile.prod -t ocm-web:ci web/

      - name: Serve & smoke check
        run: |
          docker run -d --name ocm-web-ci -p 8080:80 ocm-web:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/; then break; fi
            sleep 0.5
          done
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          docker stop ocm-web-ci
