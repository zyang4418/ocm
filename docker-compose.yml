services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocm-backend-dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/tmp
    environment:
      - PORT=8080
    command: air

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ocm-web-dev
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0
