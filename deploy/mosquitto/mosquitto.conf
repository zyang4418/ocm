# OCM IoT broker (brought up by the overlay docker-compose.iot.yml).
# Credentials are bootstrapped by auth-init.sh into /mosquitto/config/auth:
# one backend user (readwrite iot/#) and one user per declared source, each
# scoped to its own subtree — see iot/spec/spec.md §8.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/auth/passwd
acl_file /mosquitto/config/auth/acl

persistence true
persistence_location /mosquitto/data/

# Production: devices should come in over TLS. Terminate here with real
# certificates (or keep TLS at your LB and leave this listener closed).
# Uncomment and mount the certs into the mosquitto_auth/mosquitto_certs
# volume; password_file/acl_file above apply to every listener.
# listener 8883
# protocol mqtt
# cafile /mosquitto/config/auth/certs/ca.crt
# certfile /mosquitto/config/auth/certs/server.crt
# keyfile /mosquitto/config/auth/certs/server.key
