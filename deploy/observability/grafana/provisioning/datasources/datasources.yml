# Provisioned datasources for the OCM observability overlay. The uids are
# referenced by the provisioned dashboard (json/ocm-overview.json).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: ocm-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: ocm-loki
    type: loki
    access: proxy
    url: http://loki:3100
