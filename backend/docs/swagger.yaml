info:
  contact: {}
  description: Classroom management backend (Go net/http ServeMux). Auth via JWT Bearer
    (HS256, 24h); mini-program identity resolved server-side via code2Session.
  title: OCM 智慧教室管理平台 API
  version: "1.0"
paths:
  /api/admin-classes:
    get:
      parameters:
      - description: search by grade/name
        in: query
        name: q
        type: string
      - default: 1
        description: 1-based page
        in: query
        name: page
        type: integer
      - default: 100
        description: page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: paged admin classes
          schema:
            $ref: '#/definitions/httpx.Paged'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List admin classes
      tags:
      - org
    post:
      consumes:
      - application/json
      parameters:
      - description: admin class input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.AdminClassInput'
      produces:
      - application/json
      responses:
        "201":
          description: created admin class
          schema:
            $ref: '#/definitions/user.AdminClass'
        "400":
          description: invalid body / grade and name required
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: grade + name already taken
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an admin class
      tags:
      - org
  /api/admin-classes/{id}:
    delete:
      parameters:
      - description: admin class id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: no content
        "400":
          description: invalid admin class id
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: admin class not found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: teaching classes still reference the admin class
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an admin class
      tags:
      - org
    get:
      parameters:
      - description: admin class id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: admin class
          schema:
            $ref: '#/definitions/user.AdminClass'
        "400":
          description: invalid admin class id
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: admin class not found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an admin class (with members)
      tags:
      - org
    put:
      consumes:
      - application/json
      parameters:
      - description: admin class id
        in: path
        name: id
        required: true
        type: integer
      - description: admin class input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.AdminClassInput'
      produces:
      - application/json
      responses:
        "200":
          description: updated admin class
          schema:
            $ref: '#/definitions/user.AdminClass'
        "400":
          description: invalid body / grade and name required
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: admin class not found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: grade + name already taken
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an admin class
      tags:
      - org
  /api/admin-classes/{id}/students:
    get:
      parameters:
      - description: admin class id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: roster entries
          schema:
            items:
              $ref: '#/definitions/user.StudentProfileView'
            type: array
        "400":
          description: invalid admin class id
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: admin class not found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List a class's roster
      tags:
      - org
    post:
      consumes:
      - application/json
      parameters:
      - description: admin class id
        in: path
        name: id
        required: true
        type: integer
      - description: roster entry input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.StudentProfileInput'
      produces:
      - application/json
      responses:
        "201":
          description: added roster entry
          schema:
            $ref: '#/definitions/user.StudentProfileView'
        "400":
          description: invalid body / user is not a student
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: admin class not found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: student already in a class
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a student to the roster
      tags:
      - org
  /api/admin-classes/{id}/students/{userId}:
    delete:
      parameters:
      - description: admin class id
        in: path
        name: id
        required: true
        type: integer
      - description: user id
        in: path
        name: userId
        required: true
        type: integer
      responses:
        "204":
          description: no content
        "400":
          description: user is not in this class
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: admin class not found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove a student from the roster
      tags:
      - org
    put:
      consumes:
      - application/json
      parameters:
      - description: admin class id
        in: path
        name: id
        required: true
        type: integer
      - description: user id
        in: path
        name: userId
        required: true
        type: integer
      - description: roster entry input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.StudentProfileInput'
      produces:
      - application/json
      responses:
        "200":
          description: updated roster entry
          schema:
            $ref: '#/definitions/user.StudentProfileView'
        "400":
          description: invalid body / user is not in this class
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: admin class not found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a roster entry
      tags:
      - org
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: token + user view
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "401":
          description: invalid credentials
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Login with username/password
      tags:
      - auth
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: user view with roles/groups/permissions
          schema:
            $ref: '#/definitions/auth.UserView'
        "401":
          description: not authenticated
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the current user's identity
      tags:
      - auth
  /api/auth/wx-bind:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials + wx.login() code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.WxBindRequest'
      produces:
      - application/json
      responses:
        "200":
          description: token + user view
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: invalid body / already bound
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: invalid credentials
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Bind a WeChat openid to an existing account
      tags:
      - auth
  /api/auth/wx-login:
    post:
      consumes:
      - application/json
      parameters:
      - description: wx.login() code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.WxLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: token + user view
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: code required / account not bound
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: WeChat mini-program silent login (bound accounts only)
      tags:
      - auth
  /api/auth/wx-unbind:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: fresh token + user view
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: no binding to remove
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: not authenticated
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unbind the current user's WeChat openid
      tags:
      - auth
  /api/bookings:
    get:
      parameters:
      - description: filter by classroom id
        in: query
        name: classroom_id
        type: integer
      - description: filter by status
        enum:
        - pending
        - approved
        - rejected
        - cancelled
        in: query
        name: status
        type: string
      - description: date range start (Y-M-D)
        in: query
        name: from
        type: string
      - description: date range end (Y-M-D)
        in: query
        name: to
        type: string
      - description: search
        in: query
        name: q
        type: string
      - default: 1
        description: 1-based page
        in: query
        name: page
        type: integer
      - default: 100
        description: page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: paged booking views
          schema:
            $ref: '#/definitions/httpx.Paged'
        "400":
          description: invalid filter
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List classroom bookings
      tags:
      - bookings
    post:
      consumes:
      - application/json
      parameters:
      - description: booking input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/booking.BookingInput'
      produces:
      - application/json
      responses:
        "201":
