# Production compose. Provide credentials via a .env file or the real
# environment, e.g.:
#   MYSQL_ROOT_PASSWORD=...  DB_PASSWORD=...  JWT_SECRET=...  ADMIN_PASSWORD=...
# DB_PASSWORD, MYSQL_ROOT_PASSWORD, JWT_SECRET and ADMIN_PASSWORD are required and will fail fast if unset.
services:
  mysql:
    image: mysql:8.0
    container_name: ocm-mysql-prod
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-ocm}
      - MYSQL_USER=${DB_USER:-ocm}
      - MYSQL_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocm-backend-prod
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - PORT=8080
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-ocm}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - DB_NAME=${DB_NAME:-ocm}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Baked into the static bundle at image build time.
        VITE_ICP_NUMBER: ${ICP_NUMBER:-}
        VITE_DOCS_URL: ${DOCS_URL:-}
    container_name: ocm-web-prod
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production

volumes:
  mysql_prod_data:
